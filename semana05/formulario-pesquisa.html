<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 130 | Formulário HTML - Enquete do Usuário</title>
  <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>
<body>

  <header>
    <h1>WDD 130 | Formulário HTML - Enquete do Usuário</h1>
  </header>

  <main>
    <form>
      <!-- Grupo 1: Informações de Contato -->
      <fieldset>
        <legend>Informações de Contato</legend>
        
        <div class="item-formulario coluna2">
          <label for="nomecompleto">Nome Completo:</label>
          <input type="text" id="nomecompleto" name="nomecompleto" required>
        </div>

        <div class="item-formulario coluna2">
          <label for="emaildousuario">Email:</label>
          <input type="email" id="emaildousuario" name="emaildousuario" required>
        </div>
      </fieldset>

      <!-- Grupo 2: Perguntas -->
      <fieldset>
        <legend>Perguntas</legend>

        <div class="item-formulario coluna1">
          <label for="navegador">Qual é o seu navegador favorito?</label>
          <select id="navegador" name="navegador">
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="edge">Edge</option>
            <option value="brave">Brave</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="item-formulario coluna1 pergunta-pet">
          <label for="pet">Você tem um animal de estimação?</label>
          <input type="checkbox" id="pet" name="pet">
        </div>

        <div class="item-formulario-textarea">
          <label for="feedback">Liste os lugares onde você morou:</label>
          <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
        </div>
      </fieldset>

      <!-- Botão Enviar Enquete -->
      <button type="submit">Enviar Pesquisa</button>
    </form>
  </main>

  <footer>
    <p>©2026 | Formulário HTML - Atividade de Pesquisa de Usuário | Eliza Ribeiro</p>
  </footer>

</body>
</html>
